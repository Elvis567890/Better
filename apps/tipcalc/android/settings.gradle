include ':app'

def flutterRoot = System.getenv('FLUTTER_ROOT')
if (flutterRoot == null) {
    // Fallback to relative path if FLUTTER_ROOT is not set.
    flutterRoot = new File(rootProject.projectDir.parentFile, '../flutter').absolutePath
}
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
