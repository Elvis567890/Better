include ':app'

def flutterProjectRoot = rootProject.projectDir.parentFile.toPath()

def flutterRoot = System.getenv('FLUTTER_ROOT')
if (flutterRoot == null) {
    flutterRoot = "${flutterProjectRoot}/../flutter"
}

def flutterSdkPath = file(flutterRoot)
apply from: "$flutterSdkPath/packages/flutter_tools/gradle/flutter.gradle"
