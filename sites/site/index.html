<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Design Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <h1>Graphic Design Portfolio</h1>
        <nav>
            <a href="#services">Services</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Creative Solutions for Your Brand</h2>
        <p>Minimalist designs that make an impact.</p>
    </section>

    <section id="services" class="services">
        <h2>Services</h2>
        <ul>
            <li>Logo Design</li>
            <li>Brand Identity</li>
            <li>Print Design</li>
        </ul>
    </section>

    <section id="portfolio" class="portfolio">
        <h2>Portfolio</h2>
        <div class="grid">
            <img src="https://via.placeholder.com/300x200?text=Project+1" alt="Project 1">
            <img src="https://via.placeholder.com/300x200?text=Project+2" alt="Project 2">
            <img src="https://via.placeholder.com/300x200?text=Project+3" alt="Project 3">
            <img src="https://via.placeholder.com/300x200?text=Project+4" alt="Project 4">
        </div>
    </section>

    <section id="contact" class="contact">
        <h2>Contact</h2>
        <form id="contactForm">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" placeholder="Your Message" rows="4" required></textarea>
            <button type="submit">Send</button>
        </form>
        <p id="formMessage" class="hidden"></p>
    </section>

    <footer class="site-footer">
        <p>&copy; 2026 Graphic Design Portfolio</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
