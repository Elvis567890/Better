<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Showcase my services">
  <title>Freelance Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>Freelance Portfolio</h1>
      <nav>
        <ul id="nav">
          <li><a href="#home">Home</a></li>
          <li><a href="#services">Services</a></li>
          <li><a href="#portfolio">Portfolio</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
        <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
      </nav>
    </div>
  </header>

  <main>
    <section id="home" class="section">
      <div class="container">
        <h2>Welcome to my portfolio</h2>
      </div>
    </section>

    <section id="services" class="section">
      <div class="container">
        <h2>Services</h2>
        <p>Graphic Design, Copywriting, Data Entry</p>
      </div>
    </section>

    <section id="portfolio" class="section">
      <div class="container">
        <h2>Portfolio</h2>
        <p>Sample works</p>
      </div>
    </section>

    <section id="contact" class="section">
      <div class="container">
        <h2>Contact</h2>
        <p>Contact me at <a href="mailto:email@example.com">email@example.com</a></p>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Freelance Portfolio</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
