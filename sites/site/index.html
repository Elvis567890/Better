<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyService - Business</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MyService</h1>
        <nav>
            <a href="#portfolio">Portfolio</a>
            <a href="#contact">Contact</a>
            <a href="#payment">Buy</a>
        </nav>
    </header>

    <main>
        <section id="hero">
            <h2>Welcome to MyService</h2>
            <p>Professional solutions for your business.</p>
        </section>

        <section id="portfolio">
            <h2>Portfolio</h2>
            <div class="grid">
                <div class="item">
                    <img src="https://via.placeholder.com/300x200" alt="Project 1">
                    <h3>Project 1</h3>
                </div>
                <div class="item">
                    <img src="https://via.placeholder.com/300x200" alt="Project 2">
                    <h3>Project 2</h3>
                </div>
                <div class="item">
                    <img src="https://via.placeholder.com/300x200" alt="Project 3">
                    <h3>Project 3</h3>
                </div>
                <div class="item">
                    <img src="https://via.placeholder.com/300x200" alt="Project 4">
                    <h3>Project 4</h3>
                </div>
            </div>
        </section>

        <section id="contact">
            <h2>Contact Us</h2>
            <form id="contactForm">
                <label>
                    Name
                    <input type="text" name="name" required>
                </label>
                <label>
                    Email
                    <input type="email" name="email" required>
                </label>
                <label>
                    Message
                    <textarea name="message" rows="4" required></textarea>
                </label>
                <button type="submit">Send</button>
                <div id="contactMsg" class="msg"></div>
            </form>
        </section>

        <section id="payment">
            <h2>Buy Our Service</h2>
            <form id="paymentForm">
                <label>
                    Amount (USD)
                    <input type="number" name="amount" min="1" value="10" required>
                </label>
                <button type="submit">Pay Now</button>
                <div id="paymentMsg" class="msg"></div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MyService</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
