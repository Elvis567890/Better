<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Timer Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Productivity Timer Pro</h1>
    <p>Download the best free timer app for developers.</p>

    <div class="timer">
      <div id="display">00:00</div>
      <div class="controls">
        <input type="number" id="minutes" placeholder="Minutes" min="0">
        <button id="startBtn">Start</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="resetBtn" disabled>Reset</button>
      </div>
    </div>

    <a href="#" class="download-btn">Download Now</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
