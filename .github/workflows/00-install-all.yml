          async def owner_confirm(client, **_i):
              from ..memory import Memory
              m = Memory()
              m.db.execute("""CREATE TABLE IF NOT EXISTS pending_payments(
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  client TEXT, amount REAL, currency TEXT, ref TEXT,
