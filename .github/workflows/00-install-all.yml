name: Install all BOAT files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create directories
        run: mkdir -p boat/tools boat/triggers

      - name: Write all Python files
        run: |
          python - <<'PYTHON_INSTALLER'
          import os, pathlib

          files = {}

          # ============ boat/__init__.py ============
          files["boat/__init__.py"] = "# BOAT package\n"

          # ============ boat/run_once.py ============
          files["boat/run_once.py"] = '''"""Entrypoint for GitHub Actions."""
          import asyncio
          import logging
          import os

          from .brain import Boat

          logging.basicConfig(
              level=logging.INFO,
              format="%(asctime)s %(levelname)s %(name)s: %(message)s",
          )


          def main():
              cmd = os.environ.get("BOAT_CMD") or "make money anywhere today"
              chat = os.environ.get("BOAT_CHAT") or None
              asyncio.run(Boat().handle(cmd, source="github", reply_to=chat))


          if __name__ == "__main__":
              main()
          '''

          # ============ boat/memory.py ============
          files["boat/memory.py"] = '''"""BOAT memory."""
          import json
          import os
          import sqlite3
          import time

          SCHEMA = """
          CREATE TABLE IF NOT EXISTS missions(
            id TEXT PRIMARY KEY, command TEXT, source TEXT, status TEXT,
            money_today REAL DEFAULT 0, pivots INTEGER DEFAULT 0,
            created REAL, updated REAL, meta TEXT);
          CREATE TABLE IF NOT EXISTS payments(
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            mission_id TEXT, source TEXT, amount REAL, currency TEXT,
            ref TEXT, verified INTEGER DEFAULT 0, ts REAL);
          CREATE TABLE IF NOT EXISTS lessons(
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            mission_id TEXT, kind TEXT, text TEXT, ts REAL);
          CREATE TABLE IF NOT EXISTS chat_history(
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            role TEXT, text TEXT, ts REAL);
          CREATE TABLE IF NOT EXISTS pending_payments(
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            client TEXT, amount REAL, currency TEXT, ref TEXT,
            raw TEXT, mission_id TEXT, status TEXT, created REAL);
          CREATE TABLE IF NOT EXISTS vault(
            service TEXT PRIMARY KEY, kind TEXT, username TEXT, password TEXT,
            extra TEXT, notes TEXT, created REAL, last_used REAL);
          CREATE TABLE IF NOT EXISTS projects(
            id TEXT PRIMARY KEY, title TEXT, goal TEXT, status TEXT,
            stage TEXT, plan TEXT, done TEXT, blocked TEXT, notes TEXT,
            created REAL, updated REAL);
          CREATE TABLE IF NOT EXISTS big_projects(
            id TEXT PRIMARY KEY, title TEXT, goal TEXT, platform TEXT,
            total_sprints INTEGER, done_sprints INTEGER,
            current_sprint INTEGER, sprint_list TEXT, status TEXT,
            slug TEXT, created REAL, updated REAL);
          CREATE TABLE IF NOT EXISTS kv(k TEXT PRIMARY KEY, v TEXT);
          """


          class Memory:
              def __init__(self, path=None):
                  self.path = path or os.environ.get("BOAT_DB", "boat.db")
                  self.db = sqlite3.connect(self.path, check_same_thread=False)
                  self.db.executescript(SCHEMA)
                  self.db.commit()

              def create_mission(self, mid, command, source):
                  now = time.time()
                  self.db.execute(
                      "INSERT INTO missions(id,command,source,status,created,updated)"
                      " VALUES(?,?,?,?,?,?)",
                      (mid, command, source, "thinking", now, now))
                  self.db.commit()

              def update_mission(self, mid, **kw):
                  if not kw: return
                  cols = ", ".join(f"{k}=?" for k in kw)
                  self.db.execute(
                      f"UPDATE missions SET {cols}, updated=? WHERE id=?",
                      (*kw.values(), time.time(), mid))
                  self.db.commit()

              def record_payment(self, mid, source, amount, currency="USD",
                                 ref="", verified=0):
                  self.db.execute(
                      "INSERT INTO payments(mission_id,source,amount,currency,ref,"
                      "verified,ts) VALUES(?,?,?,?,?,?,?)",
                      (mid, source, amount, currency, ref, verified, time.time()))
                  self.db.commit()

              def money_today(self):
                  start = time.time() - 86400
                  cur = self.db.execute(
                      "SELECT COALESCE(SUM(amount),0) FROM payments "
                      "WHERE verified=1 AND ts>=?", (start,))
                  return float(cur.fetchone()[0] or 0)

              def add_lesson(self, mid, kind, text):
                  self.db.execute(
                      "INSERT INTO lessons(mission_id,kind,text,ts) VALUES(?,?,?,?)",
                      (mid, kind, text, time.time()))
                  self.db.commit()

              def add_chat(self, role, text):
                  self.db.execute(
                      "INSERT INTO chat_history(role,text,ts) VALUES(?,?,?)",
                      (role, text, time.time()))
                  self.db.commit()

              def recent_chat(self, n=12):
                  rows = self.db.execute(
                      "SELECT role,text,ts FROM chat_history "
                      "ORDER BY ts DESC LIMIT ?", (n,)).fetchall()
                  rows.reverse()
                  return [{"role": r[0], "text": r[1], "ts": r[2]} for r in rows]

              def recent_context(self, n=5):
                  missions = self.db.execute(
                      "SELECT id,command,status,money_today FROM missions "
                      "ORDER BY created DESC LIMIT ?", (n,)).fetchall()
                  lessons = self.db.execute(
                      "SELECT kind,text FROM lessons ORDER BY ts DESC LIMIT 10").fetchall()
                  return {
                      "recent_missions": [
                          {"id": m[0], "command": m[1], "status": m[2],
                           "money_today": m[3]} for m in missions],
                      "lessons": [{"kind": l[0], "text": l[1]} for l in lessons],
                      "money_today_total": self.money_today(),
                  }

              def kv_get(self, k, default=None):
                  row = self.db.execute("SELECT v FROM kv WHERE k=?", (k,)).fetchone()
                  return json.loads(row[0]) if row else default

              def kv_set(self, k, v):
                  self.db.execute("INSERT OR REPLACE INTO kv(k,v) VALUES(?,?)",
                                  (k, json.dumps(v)))
                  self.db.commit()
          '''

          # ============ boat/tools/__init__.py ============
          files["boat/tools/__init__.py"] = '''"""Tool registry."""
          import inspect
          import os
          import traceback

          REGISTRY = {}


          def tool(name, desc, params=None, danger="low"):
              def deco(fn):
                  REGISTRY[name] = {
                      "name": name, "desc": desc, "fn": fn,
                      "params": params or {"type": "object", "properties": {}},
                      "danger": danger,
                  }
                  return fn
              return deco


          def tool_specs():
              return [{"name": v["name"], "description": v["desc"],
                       "parameters": v["params"]} for v in REGISTRY.values()]


          async def call_tool(name, args):
              if name not in REGISTRY:
                  raise KeyError(f"unknown tool: {name}")
              fn = REGISTRY[name]["fn"]
              if inspect.iscoroutinefunction(fn):
                  return await fn(**(args or {}))
              return fn(**(args or {}))


          def load_all():
              print("[load_all] starting")
              for name in ("shell_tool", "browser_tool", "phone_tool",
                           "gmail_tool", "momo_tool", "github_tool",
                           "social_tool", "telegram_tool"):
                  try:
                      __import__(f"boat.tools.{name}")
                  except Exception as e:
                      print(f"[load_all] FAIL core/{name}: {e}")
                      traceback.print_exc()
              for name in ("all_tools", "self_builder", "accounts_vault",
                           "auto_heal", "ask_tool", "payments", "big_project"):
                  try:
                      __import__(f"boat.tools.{name}")
                      print(f"[load_all] OK  {name}")
                  except Exception as e:
                      print(f"[load_all] FAIL {name}: {e}")
                      traceback.print_exc()
              auto_dir = os.path.join(os.path.dirname(__file__), "auto")
              if os.path.isdir(auto_dir):
                  for fname in os.listdir(auto_dir):
                      if fname.endswith(".py") and not fname.startswith("_"):
                          try:
                              __import__(f"boat.tools.auto.{fname[:-3]}")
                          except Exception as e:
                              print(f"[load_all] FAIL auto/{fname}: {e}")
              print(f"[load_all] done. REGISTRY has {len(REGISTRY)} tools")
          '''

          # ============ boat/tools/telegram_tool.py ============
          files["boat/tools/telegram_tool.py"] = '''"""Telegram tools."""
          import os
          import httpx
          from . import tool


          @tool("telegram.send", "Send a Telegram message.",
                {"type": "object", "properties": {
                    "chat_id": {"type": "string"}, "text": {"type": "string"}},
                 "required": ["chat_id", "text"]})
          async def telegram_send(chat_id, text):
              token = os.environ["TELEGRAM_BOT_TOKEN"]
              async with httpx.AsyncClient(timeout=20) as c:
                  r = await c.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      json={"chat_id": str(chat_id), "text": text[:4000]})
                  return {"ok": r.status_code == 200, "body": r.text[:300]}


          @tool("telegram.send_document", "Send a file to Telegram.",
                {"type": "object", "properties": {
                    "chat_id": {"type": "string"}, "path": {"type": "string"},
                    "caption": {"type": "string", "default": ""}},
                 "required": ["chat_id", "path"]})
          async def telegram_send_document(chat_id, path, caption=""):
              token = os.environ["TELEGRAM_BOT_TOKEN"]
              async with httpx.AsyncClient(timeout=120) as c:
                  with open(path, "rb") as f:
                      r = await c.post(
                          f"https://api.telegram.org/bot{token}/sendDocument",
                          data={"chat_id": str(chat_id), "caption": caption},
                          files={"document": f})
                  return {"ok": r.status_code == 200, "body": r.text[:300]}
          '''

          # ============ boat/tools/github_tool.py ============
          files["boat/tools/github_tool.py"] = '''"""GitHub tools."""
          import base64
          import os
          import httpx
          from . import tool

          API = "https://api.github.com"


          def _h():
              return {"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json"}


          @tool("github.push_file", "Create or update a file in a GitHub repo.",
                {"type": "object", "properties": {
                    "repo": {"type": "string"}, "path": {"type": "string"},
                    "content": {"type": "string"},
                    "message": {"type": "string", "default": "boat: update"},
                    "branch": {"type": "string", "default": "main"}},
                 "required": ["repo", "path", "content"]})
          async def github_push_file(repo, path, content,
                                     message="boat: update", branch="main"):
              async with httpx.AsyncClient(timeout=30, headers=_h()) as c:
                  sha = None
                  r = await c.get(f"{API}/repos/{repo}/contents/{path}",
                                  params={"ref": branch})
                  if r.status_code == 200:
                      sha = r.json().get("sha")
                  body = {"message": message, "branch": branch,
                          "content": base64.b64encode(content.encode()).decode()}
                  if sha:
                      body["sha"] = sha
                  r = await c.put(f"{API}/repos/{repo}/contents/{path}", json=body)
                  return {"ok": r.status_code in (200, 201),
                          "status": r.status_code, "body": r.text[:800]}


          @tool("github.dispatch", "Trigger a GitHub Actions workflow.",
                {"type": "object", "properties": {
                    "repo": {"type": "string"}, "workflow": {"type": "string"},
                    "ref": {"type": "string", "default": "main"},
                    "inputs": {"type": "object"}},
                 "required": ["repo", "workflow"]})
          async def github_dispatch(repo, workflow, ref="main", inputs=None):
              async with httpx.AsyncClient(timeout=30, headers=_h()) as c:
                  r = await c.post(
                      f"{API}/repos/{repo}/actions/workflows/{workflow}/dispatches",
                      json={"ref": ref, "inputs": inputs or {}})
                  return {"ok": r.status_code == 204, "status": r.status_code}
          '''

          # ============ boat/tools/shell_tool.py ============
          files["boat/tools/shell_tool.py"] = '''"""Shell tool."""
          import asyncio
