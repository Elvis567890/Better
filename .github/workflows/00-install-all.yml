          # ============ boat/tools/auto_heal.py ============
          files["boat/tools/auto_heal.py"] = '''"""Universal self-healer."""
          import json
          import re
          from . import tool, call_tool


          @tool("self.auto_heal", "Universal self-healer for failed steps.",
                {"type": "object", "properties": {
                    "failed_step": {"type": "object"},
                    "error": {"type": "string"},
                    "mission_context": {"type": "object"}},
                 "required": ["failed_step", "error"]}, danger="medium")
          async def auto_heal(failed_step, error, mission_context=None, **_i):
              e = (error or "").lower()
              tool_name = (failed_step or {}).get("tool", "")
              args = (failed_step or {}).get("args", {})

              if "unknown tool" in e or "keyerror" in e:
                  m = re.search(r"unknown tool:\\s*([a-z0-9_.]+)", error or "", re.I)
                  missing = m.group(1) if m else tool_name
                  try:
                      await call_tool("self.write_tool", {
                          "tool_name": missing,
                          "purpose": f"tool {missing} called with {json.dumps(args)}",
                          "example_args": args})
                      return {"healed": True, "kind": "unknown_tool"}
                  except Exception as ex:
                      return {"healed": False, "error": str(ex)}

              if "429" in e or "rate" in e or "busy" in e:
                  import asyncio
                  await asyncio.sleep(15)
                  return {"healed": True, "kind": "rate_limit",
                          "next_steps": [{"tool": tool_name, "args": args,
                                          "why": "retry after wait"}]}

              if "no such file" in e or "not found" in e or "404" in e:
                  t = (tool_name or "").lower()
                  if "build" in t or "apk" in t:
                      slug = args.get("app_slug", "app")
                      spec = (mission_context or {}).get("command", "build the app")
                      return {"healed": True, "kind": "missing_file",
                              "next_steps": [
                                  {"tool": "code.write_flutter_app",
                                   "args": {"spec": spec, "app_slug": slug}},
                                  {"tool": "code.build_apk",
                                   "args": {"app_slug": slug, "spec": spec}}]}

              return {"healed": False, "error": error[:300]}
          '''

          # ============ boat/tools/self_builder.py ============
          files["boat/tools/self_builder.py"] = '''"""Self-builder."""
          import json
          import os
          import re
          import httpx
          from . import tool


          async def _llm(prompt, max_tokens=6000):
              base = os.environ.get("BOAT_LLM_BASE", "https://api.groq.com/openai/v1")
              key = os.environ["BOAT_LLM_KEY"]
              model = os.environ.get("BOAT_LLM_MODEL", "llama-3.3-70b-versatile")
              async with httpx.AsyncClient(timeout=120) as c:
                  r = await c.post(f"{base}/chat/completions",
                      headers={"Authorization": f"Bearer {key}"},
                      json={"model": model,
                            "messages": [{"role": "user", "content": prompt}],
                            "temperature": 0.2, "max_tokens": max_tokens})
                  r.raise_for_status()
                  return r.json()["choices"][0]["message"]["content"]


          @tool("self.write_tool", "BOAT writes a new tool for itself.",
                {"type": "object", "properties": {
                    "tool_name": {"type": "string"},
                    "purpose": {"type": "string"},
                    "example_args": {"type": "object"}},
                 "required": ["tool_name", "purpose"]}, danger="high")
          async def write_tool(tool_name, purpose, example_args=None, **_i):
              safe = re.sub(r"[^a-z0-9_]", "_", tool_name.lower().replace(".", "_"))
              path = f"boat/tools/auto/{safe}.py"
              code = await _llm(
                  f"Write a Python tool for BOAT.\\n"
                  f"Tool name: {tool_name}\\nPurpose: {purpose}\\n\\n"
                  f"Return ONLY Python code for boat/tools/auto/{safe}.py. "
                  f"Import from .. import tool. Return dict with 'ok' key.", 4000)
              code = re.sub(r"^```[a-z]*\\n?", "", code)
              code = re.sub(r"\\n?```$", "", code)
              from .github_tool import github_push_file
              repo = os.environ["GITHUB_REPOSITORY"]
              r = await github_push_file(repo=repo, path=path, content=code,
                                         message=f"boat: self-build {tool_name}")
              return {"ok": r.get("ok"), "tool_name": tool_name, "path": path}
          '''

          # ============ boat/tools/accounts_vault.py ============
          files["boat/tools/accounts_vault.py"] = '''"""Accounts vault."""
          import json
          import time
          from . import tool


          @tool("vault.save_account", "Store credentials for a service.",
                {"type": "object", "properties": {
                    "service": {"type": "string"}, "kind": {"type": "string"},
                    "username": {"type": "string"}, "password": {"type": "string"},
                    "extra": {"type": "object"}, "notes": {"type": "string"}},
                 "required": ["service"]}, danger="high")
          async def save_account(service, kind="generic", username="",
                                 password="", extra=None, notes="", **_i):
              from ..memory import Memory
              m = Memory()
              now = time.time()
              m.db.execute(
                  "INSERT OR REPLACE INTO vault(service,kind,username,password,"
                  "extra,notes,created,last_used) "
                  "VALUES(?,?,?,?,?,?,COALESCE((SELECT created FROM vault WHERE service=?),?),?)",
                  (service, kind, username, password, json.dumps(extra or {}),
                   notes, service, now, now))
              m.db.commit()
              return {"ok": True, "service": service}


          @tool("vault.get_account", "Retrieve stored credentials.",
                {"type": "object", "properties": {"service": {"type": "string"}},
                 "required": ["service"]}, danger="high")
          async def get_account(service, **_i):
              from ..memory import Memory
              m = Memory()
              row = m.db.execute(
                  "SELECT kind,username,password,extra,notes FROM vault "
                  "WHERE service=?", (service,)).fetchone()
              if not row:
                  return {"ok": False, "reason": f"no account for {service}"}
              m.db.execute("UPDATE vault SET last_used=? WHERE service=?",
                           (time.time(), service))
              m.db.commit()
              try:
                  extra_obj = json.loads(row[3] or "{}")
              except Exception:
                  extra_obj = {}
              return {"ok": True, "service": service, "kind": row[0],
                      "username": row[1], "password": row[2],
                      "extra": extra_obj, "notes": row[4]}
          '''

          # ============ boat/tools/big_project.py ============
          files["boat/tools/big_project.py"] = '''"""Big project tracker."""
          import json
          import os
          import re
          import time
          import uuid
          import httpx
          from . import tool


          async def _llm(prompt, max_tokens=4000):
              base = os.environ.get("BOAT_LLM_BASE", "https://api.groq.com/openai/v1")
              key = os.environ["BOAT_LLM_KEY"]
              model = os.environ.get("BOAT_LLM_MODEL", "llama-3.3-70b-versatile")
              async with httpx.AsyncClient(timeout=180) as c:
                  r = await c.post(f"{base}/chat/completions",
                      headers={"Authorization": f"Bearer {key}"},
                      json={"model": model,
                            "messages": [{"role": "user", "content": prompt}],
                            "temperature": 0.2, "max_tokens": max_tokens})
                  r.raise_for_status()
                  return r.json()["choices"][0]["message"]["content"]


          def _json(s):
              if not s: return {}
              s = s.strip()
              s = re.sub(r"^```(?:json)?\\s*", "", s)
              s = re.sub(r"\\s*```$", "", s)
              try: return json.loads(s)
              except Exception:
                  m = re.search(r"\\{.*\\}", s, re.S)
                  if not m: return {}
                  try: return json.loads(m.group(0))
                  except Exception: return {}


          def _db():
              from ..memory import Memory
              m = Memory()
              m.db.executescript("""CREATE TABLE IF NOT EXISTS big_projects(
                  id TEXT PRIMARY KEY, title TEXT, goal TEXT, platform TEXT,
                  total_sprints INTEGER, done_sprints INTEGER,
                  current_sprint INTEGER, sprint_list TEXT, status TEXT,
                  slug TEXT, created REAL, updated REAL);""")
              m.db.commit()
              return m


          def _slugify(s):
              s = (s or "bigproj").lower().strip()
              s = re.sub(r"[^a-z0-9]+", "_", s)
              return s.strip("_")[:40] or "bigproj"


          @tool("big.start", "Start a BIG project split into sprints.",
                {"type": "object", "properties": {
                    "title": {"type": "string"}, "goal": {"type": "string"},
                    "platform": {"type": "string"},
                    "max_sprints": {"type": "integer", "default": 20}},
                 "required": ["title", "goal"]}, danger="high")
          async def start(title, goal, platform="android", max_sprints=20, **_i):
              slug = _slugify(title)
              raw = await _llm(
                  f"Break this into {max_sprints} sprints.\\n"
                  f"Project: {title}\\nGoal: {goal}\\nPlatform: {platform}\\n"
                  f'Return ONLY JSON: {{"sprints":[{{"n":1,"title":"..","deliverable":".."}}]}}')
              data = _json(raw)
              sprints = data.get("sprints") or []
              if not sprints:
                  return {"ok": False, "error": "no sprints"}
              m = _db()
              pid = uuid.uuid4().hex[:8]
              now = time.time()
              m.db.execute(
                  "INSERT INTO big_projects(id,title,goal,platform,total_sprints,"
                  "done_sprints,current_sprint,sprint_list,status,slug,created,updated) "
                  "VALUES(?,?,?,?,?,?,?,?,?,?,?,?)",
                  (pid, title, goal, platform, len(sprints), 0, 1,
                   json.dumps(sprints), "active", slug, now, now))
              m.db.commit()
              return {"ok": True, "project_id": pid, "sprint_count": len(sprints),
                      "first_sprint": sprints[0]}


          @tool("big.next", "Run the next sprint of a big project.",
                {"type": "object", "properties": {"project_id": {"type": "string"}}},
                danger="high")
          async def next_sprint(project_id=None, **_i):
              m = _db()
              if project_id:
                  row = m.db.execute(
                      "SELECT id,title,goal,platform,total_sprints,done_sprints,"
                      "current_sprint,sprint_list,slug FROM big_projects WHERE id=?",
                      (project_id,)).fetchone()
              else:
                  row = m.db.execute(
                      "SELECT id,title,goal,platform,total_sprints,done_sprints,"
                      "current_sprint,sprint_list,slug FROM big_projects "
                      "WHERE status='active' ORDER BY updated DESC LIMIT 1").fetchone()
              if not row:
                  return {"ok": False, "reason": "no active project"}
              (pid, title, goal, platform, total, done_count, cur, sprint_list, slug) = row
              sprints = json.loads(sprint_list or "[]")
              if cur > total:
                  m.db.execute("UPDATE big_projects SET status='done',updated=? WHERE id=?",
                               (time.time(), pid))
                  m.db.commit()
                  return {"ok": True, "status": "done"}
              this_sprint = sprints[cur - 1] if cur <= len(sprints) else None
              if not this_sprint:
                  return {"ok": False, "reason": "no more sprints"}
              from . import call_tool
              spec = (f"Sprint {cur} of {total} for '{title}'.\\n"
                      f"Goal: {goal}\\nSprint: {this_sprint.get('title')}\\n"
                      f"Deliverable: {this_sprint.get('deliverable')}\\n\\n"
                      f"Write FULL main.dart including sprints 1 through {cur}.")
              try:
                  wr = await call_tool("code.write_flutter_app",
                                       {"spec": spec, "app_slug": slug})
              except Exception as e:
                  return {"ok": False, "error": str(e)}
              m.db.execute("UPDATE big_projects SET done_sprints=?,"
                           "current_sprint=?,updated=? WHERE id=?",
                           (done_count + 1, cur + 1, time.time(), pid))
              m.db.commit()
              return {"ok": True, "sprint_completed": cur,
                      "sprint_title": this_sprint.get("title"),
                      "next_sprint": cur + 1}
          '''

          # Write all files
          import os
          for path, content in files.items():
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w") as f:
                  f.write(content)
              print(f"wrote {path}")

          print(f"\\nTotal: {len(files)} files written")
          PYTHON_INSTALLER

