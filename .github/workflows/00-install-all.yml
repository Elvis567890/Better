              except asyncio.TimeoutError:
                  proc.kill()
                  return {"ok": False, "error": "timeout"}
              return {"ok": proc.returncode == 0, "code": proc.returncode,
                      "stdout": out.decode(errors="ignore")[:8000],
                      "stderr": err.decode(errors="ignore")[:4000]}
          '''

