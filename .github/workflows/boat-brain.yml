name: BOAT brain

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Boat, do ..."
        required: true
        default: "make money anywhere today"
      chat_id:
        description: "Telegram chat_id (leave blank to use TELEGRAM_ALLOWED)"
        required: false
  repository_dispatch:
    types: [boat-command]

permissions:
  contents: write
  actions: write

concurrency:
  group: boat-brain
  cancel-in-progress: false

jobs:
  think:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install httpx playwright
          fi
          python -m playwright install --with-deps chromium || true

      - name: Resolve command
        id: cmd
        run: |
          CMD="${{ github.event.inputs.command || github.event.client_payload.command || 'make money anywhere today' }}"
          CHAT="${{ github.event.inputs.chat_id || github.event.client_payload.chat_id || secrets.TELEGRAM_ALLOWED }}"
          echo "command=$CMD" >> "$GITHUB_OUTPUT"
          echo "chat_id=$CHAT" >> "$GITHUB_OUTPUT"
          echo "Will run: $CMD"
          echo "Will reply to: $CHAT"

      - name: Run BOAT
        env:
          BOAT_LLM_BASE:         ${{ secrets.BOAT_LLM_BASE }}
          BOAT_LLM_KEY:          ${{ secrets.BOAT_LLM_KEY }}
          BOAT_LLM_MODEL:        ${{ secrets.BOAT_LLM_MODEL }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED:      ${{ secrets.TELEGRAM_ALLOWED }}
          GITHUB_TOKEN:          ${{ secrets.BOAT_GH_TOKEN }}
          GMAIL_USER:            ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:    ${{ secrets.GMAIL_APP_PASSWORD }}
          MOMO_BASE_URL:         ${{ secrets.MOMO_BASE_URL }}
          MOMO_SUBSCRIPTION_KEY: ${{ secrets.MOMO_SUBSCRIPTION_KEY }}
          PAY_MOMO:              ${{ secrets.PAY_MOMO }}
          PAY_MOMO_NAME:         ${{ secrets.PAY_MOMO_NAME }}
          BOAT_DAILY_GOAL:       "10"
          BOAT_CMD:              ${{ steps.cmd.outputs.command }}
          BOAT_CHAT:             ${{ steps.cmd.outputs.chat_id }}
        run: python -m boat.run_once

      - name: Commit memory
        if: always()
        run: |
          git config user.name  "boat-bot"
          git config user.email "boat@users.noreply.github.com"
          git add -f boat.db 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no memory change"
          else
            git commit -m "boat: memory"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}" || true
          fi
